<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>L站笔记导出</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body class="sidepanel">
  <header class="header sticky-header">
    <div class="logo">N</div>
    <div class="header-text">
      <h1>L站 → Obsidian</h1>
      <p class="sub" id="pageStatus">检测当前页面…</p>
    </div>
    <button type="button" class="btn-mini btn-refresh" id="btnRefresh" title="刷新">刷新</button>
  </header>

  <main class="panel-body">

  <section class="card" id="topicCard" hidden>
    <div class="topic-title" id="topicTitle">—</div>
    <div class="topic-meta" id="topicMeta"></div>
  </section>

  <section class="card">
    <label class="field-label">导出范围</label>
    <div class="seg seg-4" role="radiogroup">
      <label class="seg-item">
        <input type="radio" name="mode" value="all" checked />
        <span>全部</span>
      </label>
      <label class="seg-item">
        <input type="radio" name="mode" value="author" />
        <span>仅贴主</span>
      </label>
      <label class="seg-item">
        <input type="radio" name="mode" value="op" />
        <span>仅一楼</span>
      </label>
      <label class="seg-item">
        <input type="radio" name="mode" value="range" />
        <span>范围</span>
      </label>
    </div>
    <p class="mode-hint" id="modeHint">导出主题内所有楼层</p>
    <div class="range-row" id="rangeRow" hidden>
      <input type="number" id="fromFloor" min="1" placeholder="从" value="1" />
      <span>—</span>
      <input type="number" id="toFloor" min="1" placeholder="到" />
    </div>
  </section>

  <section class="card">
    <label class="field-label">正文来源</label>
    <div class="seg seg-2" role="radiogroup">
      <label class="seg-item">
        <input type="radio" name="contentSource" value="html" checked />
        <span>HTML 转换</span>
      </label>
      <label class="seg-item">
        <input type="radio" name="contentSource" value="raw" />
        <span>Raw Markdown</span>
      </label>
    </div>
    <p class="mode-hint" id="contentSourceHint">读取页面 HTML 后转换为 Markdown</p>
  </section>

  <section class="card">
    <label class="field-label">图片处理</label>
    <div class="seg seg-3" role="radiogroup">
      <label class="seg-item">
        <input type="radio" name="imageMode" value="url" checked />
        <span>L站链接</span>
      </label>
      <label class="seg-item">
        <input type="radio" name="imageMode" value="base64" />
        <span>Base64</span>
      </label>
      <label class="seg-item">
        <input type="radio" name="imageMode" value="webdav" />
        <span>WebDAV</span>
      </label>
    </div>
    <p class="mode-hint" id="imageModeHint">保留 L 站原图链接</p>
  </section>

  <section class="card" id="webdavCard" hidden>
    <div class="card-head">
      <label class="field-label" style="margin:0">WebDAV</label>
      <button type="button" class="btn-mini" id="btnTogglePwd">显示</button>
    </div>

    <label class="field-label" for="davUrl">服务器</label>
    <input
      id="davUrl"
      class="text-input"
      type="url"
      value="https://dav.jianguoyun.com/dav/"
      placeholder="https://dav.jianguoyun.com/dav/"
      spellcheck="false"
    />

    <div class="two-col">
      <div>
        <label class="field-label" for="davUser">用户名</label>
        <input id="davUser" class="text-input" type="text" placeholder="邮箱" autocomplete="username" spellcheck="false" />
      </div>
      <div>
        <label class="field-label" for="davPass">密码</label>
        <input id="davPass" class="text-input" type="password" placeholder="应用密码" autocomplete="current-password" />
      </div>
    </div>

    <div class="dav-actions">
      <button type="button" class="btn ghost btn-sm" id="btnTestDav">测试连接</button>
      <span class="dav-status" id="davStatus"></span>
    </div>
  </section>

  <section class="card">
    <label class="field-label">① 本地导出</label>
    <label class="check">
      <input type="checkbox" id="enableNoteSync" />
      <span>导出到本地文件夹</span>
    </label>
    <p class="mode-hint" id="noteSyncOffHint">关闭：浏览器下载目录</p>
    <div id="noteSyncFields" hidden>
      <div class="path-row">
        <div class="path-display" id="noteFolderDisplay" title="">未选择</div>
        <button type="button" class="btn ghost btn-sm" id="btnBrowseNoteFolder">浏览选择</button>
      </div>
      <div class="path-row path-row-actions">
        <button type="button" class="btn ghost btn-sm" id="btnClearNoteFolder">清除</button>
        <span class="mode-hint" id="pathPreview"></span>
      </div>
    </div>
  </section>

  <section class="card" id="webdavPathsCard" hidden>
    <label class="field-label">② WebDAV</label>

    <label class="check">
      <input type="checkbox" id="enableDavNoteUpload" />
      <span>上传笔记到 WebDAV</span>
    </label>
    <p class="mode-hint" id="davNoteOffHint">默认关闭，不上传 md</p>
    <div id="davNotePathFields" hidden>
      <label class="field-label">笔记上传目录</label>
      <div class="path-row">
        <div class="path-display" id="davRootDisplay" title="/">/</div>
        <input type="hidden" id="davRoot" value="/" />
        <button type="button" class="btn ghost btn-sm" id="btnBrowseRoot">浏览选择</button>
      </div>
    </div>

    <label class="field-label">图片上传目录</label>
    <div class="path-row">
      <div class="path-display" id="davImagePathDisplay" title="/attachments">/attachments</div>
      <input type="hidden" id="davImagePath" value="/attachments" />
      <button type="button" class="btn ghost btn-sm" id="btnBrowseImage">浏览选择</button>
    </div>
    <p class="mode-hint">仅上传转换后的图片</p>

    <div class="folder-browser" id="folderBrowser" hidden>
      <div class="folder-bar">
        <span class="folder-target" id="folderTargetLabel">选择文件夹</span>
        <button type="button" class="btn-mini" id="btnFolderUp">上级</button>
        <button type="button" class="btn-mini" id="btnFolderRefresh">刷新</button>
        <button type="button" class="btn-mini" id="btnFolderClose">关闭</button>
      </div>
      <div class="folder-cur" id="folderCur">/</div>
      <div class="folder-list" id="folderList"></div>
      <div class="folder-actions">
        <input id="newFolderName" class="text-input" type="text" placeholder="新建子文件夹" />
        <button type="button" class="btn ghost btn-sm" id="btnNewFolder">新建</button>
        <button type="button" class="btn primary btn-sm" id="btnUseFolder">选中</button>
      </div>
    </div>
  </section>

  <section class="card opts">
    <label class="check">
      <input type="checkbox" id="skipEmoji" checked />
      <span>Emoji 用文本</span>
    </label>
    <label class="check">
      <input type="checkbox" id="includeMeta" checked />
      <span>YAML 元信息</span>
    </label>
    <label class="check">
      <input type="checkbox" id="compactPostHeader" />
      <span>楼层用加粗</span>
    </label>
    <div class="inline-field">
      <label class="field-label" for="postHeadingLevel">楼层标题</label>
      <select id="postHeadingLevel" class="select-input">
        <option value="3">###</option>
        <option value="4" selected>####</option>
        <option value="5">#####</option>
        <option value="6">######</option>
      </select>
    </div>
  </section>

  <div class="progress" id="progress" hidden>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="progress-text" id="progressText">准备中…</div>
  </div>

  <div class="actions">
    <button id="btnExport" class="btn primary" disabled>导出笔记</button>
    <button id="btnCopy" class="btn ghost" disabled>复制 MD</button>
  </div>

  <p class="hint" id="hint"></p>
  <p class="err" id="err" hidden></p>
  </main>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
